
# Render Blueprint
# Project: Donor Trust Quota Application
# File: render.yaml
#
# Keep secrets in Render Environment settings.
# Do not commit .env or credentials to GitHub.

services:
  - type: web
    name: donor-trust-quota
    runtime: node
    plan: free

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Runtime
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Render assigns PORT automatically.
      - key: HOST
        value: "0.0.0.0"

      # Database and authentication
      - key: DATABASE_URL
        sync: false

      - key: ADMIN_API_TOKEN
        sync: false

      - key: PGSSL
        value: "true"

      # Set the exact browser origin allowed to call the API.
      # Enter this privately in Render after deciding the frontend URL.
      - key: CORS_ORIGIN
        sync: false

      # Reverse proxy
      - key: TRUST_PROXY
        value: "true"

      # Request limits
      - key: JSON_BODY_LIMIT
        value: 100kb

      - key: REQUEST_TIMEOUT_MS
        value: "30000"

      # General rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"

      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"

      # Authentication rate limiting
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "10"

      # Privacy-conscious logging
      - key: LOG_LEVEL
        value: warn

      - key: LOG_REDACT_SENSITIVE_DATA
        value: "true"

      - key: LOG_REQUEST_BODIES
        value: "false"

      - key: LOG_RESPONSE_BODIES
        value: "false"

      # Application and document safeguards
      - key: UPLOADS_PUBLICLY_ACCESSIBLE
        value: "false"

      - key: REQUIRE_CONSENT_BEFORE_SUBMISSION
        value: "true"

      # Health monitoring
      - key: HEALTH_CHECK_ENABLED
        value: "true"
