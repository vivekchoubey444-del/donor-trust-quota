============================================================

Donor Trust Quota Application

Render Blueprint

File: render.yaml

============================================================

services:

* type: web
    name: donor-trust-quota
    runtime: node
    plan: free
    Build and start
    buildCommand: npm ci
    startCommand: npm start
    Health monitoring
    healthCheckPath: /health
    Automatic deployment settings
    autoDeploy: true
    envVars:
    Application
    * key: NODE_ENV
        value: production
    * key: PORT
        value: "10000"
    * key: HOST
        value: "0.0.0.0"
    Database and authentication secrets
    Set these privately in the Render dashboard.
    * key: DATABASE_URL
        sync: false
    * key: ADMIN_API_TOKEN
        sync: false
    Frontend security
    Replace this with your actual deployed frontend origin.
    Do not include a trailing slash.
    * key: CORS_ORIGIN
        value: https://your-frontend-domain.example
    PostgreSQL connection security
    * key: PGSSL
        value: "true"
    Reverse proxy configuration
    * key: TRUST_PROXY
        value: "true"
    Request validation and limits
    * key: JSON_BODY_LIMIT
        value: 100kb
    * key: REQUEST_TIMEOUT_MS
        value: "30000"
    General rate limiting
    * key: RATE_LIMIT_WINDOW_MS
        value: "900000"
    * key: RATE_LIMIT_MAX_REQUESTS
        value: "60"
    Authentication rate limiting
    * key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: "10"
    Logging and privacy
    * key: LOG_LEVEL
        value: warn
    * key: LOG_REDACT_SENSITIVE_DATA
        value: "true"
    * key: LOG_REQUEST_BODIES
        value: "false"
    * key: LOG_RESPONSE_BODIES
        value: "false"
    Document and application security
    * key: UPLOADS_PUBLICLY_ACCESSIBLE
        value: "false"
    * key: REQUIRE_CONSENT_BEFORE_SUBMISSION
        value: "true"
    Health endpoint
    * key: HEALTH_CHECK_ENABLED
        value: "true"